<g data-node="protocol"><g fill="#dedede" stroke="#333" stroke-width="1.5"><rect x="254" y="155" width="252" height="58" rx="0"/></g><text text-anchor="middle" font-weight="600"><tspan x="380" y="179">Registrar manifesto e seeds</tspan><tspan x="380" y="199">Parear equipe e choques</tspan></text></g>
<g data-node="trace"><g fill="#dedede" stroke="#333" stroke-width="1.5"><rect x="254" y="232" width="252" height="68" rx="0"/></g><text text-anchor="middle" font-weight="600"><tspan x="380" y="261">Simular e registrar traços</tspan><tspan x="380" y="281">personaId / turnId / eventId</tspan></text></g>
<g data-node="evidence"><g fill="#dedede" stroke="#333" stroke-width="1.5"><polygon points="380,310 495,366 380,422 265,366"/></g><text text-anchor="middle" font-weight="600"><tspan x="380" y="361">Há evidência</tspan><tspan x="380" y="381">atribuída?</tspan></text></g>
