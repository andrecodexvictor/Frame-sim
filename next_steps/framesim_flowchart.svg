<g data-node="accept"><g fill="#dedede" stroke="#333" stroke-width="1.5"><rect x="528" y="562" width="208" height="68" rx="0"/></g><text text-anchor="middle" font-weight="600"><tspan x="632" y="591">Aceitar julgamento</tspan><tspan x="632" y="611">com origem e cobertura</tspan></text></g>
<g data-node="compare"><g fill="#dedede" stroke="#333" stroke-width="1.5"><rect x="254" y="690" width="252" height="68" rx="0"/></g><text text-anchor="middle" font-weight="600"><tspan x="380" y="709">Individual / comparação / lote</tspan><tspan x="380" y="729">Réplicas pareadas, ICs</tspan><tspan x="380" y="749">e exclusões identificadas</tspan></text></g>
<g data-node="report"><g fill="#dedede" stroke="#333" stroke-width="1.5"><rect x="254" y="777" width="252" height="58" rx="0"/></g><text text-anchor="middle" font-weight="600"><tspan x="380" y="801">ReportData canônico</tspan><tspan x="380" y="821">Evidências e limitações</tspan></text></g>
<g data-node="dashboard"><g fill="#dedede" stroke="#333" stroke-width="1.5"><rect x="254" y="859" width="252" height="58" rx="0"/></g><text text-anchor="middle" font-weight="600"><tspan x="380" y="883">Exibir no dashboard</tspan><tspan x="380" y="903">Dados sintéticos identificados</tspan></text></g>
<g data-node="export"><g fill="#dedede" stroke="#333" stroke-width="1.5"><rect x="254" y="941" width="252" height="58" rx="0"/></g><text text-anchor="middle" font-weight="600"><tspan x="380" y="965">Exportar artigo e dados</tspan><tspan x="380" y="985">LaTeX / PGFPlots / CSV / ZIP</tspan></text></g>
<g data-node="finish"><g fill="#dedede" stroke="#333" stroke-width="1.5"><rect x="304" y="1031" width="152" height="42" rx="21"/></g><text text-anchor="middle" font-weight="600"><tspan x="380" y="1057">Fim</tspan></text></g></g></svg>