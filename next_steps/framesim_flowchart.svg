<g data-node="calibration"><g fill="#dedede" stroke="#333" stroke-width="1.5"><polygon points="380,540 495,596 380,652 265,596"/></g><text text-anchor="middle" font-weight="600"><tspan x="380" y="591">Evidência e calibração</tspan><tspan x="380" y="611">suficientes?</tspan></text></g>
