<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1088" width="760" height="1088" role="img" aria-labelledby="framesim-title framesim-desc"><title id="framesim-title">Fluxograma do FrameSIM</title><desc id="framesim-desc">Fluxo do FrameSIM. Sem evidência atribuída, registrar indisponibilidade e abster-se. Com evidência, medir e avaliar; aceitar julgamentos apenas com evidência e calibração suficientes. Resultados e limitações alimentam o dashboard e as exportações.</desc><defs><marker id="framesim-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="760" height="1088" fill="white"/><g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717"><polyline fill="none" stroke="#333" stroke-width="1.5" points="380,49 380,77" marker-end="url(#framesim-arrow)"/>
